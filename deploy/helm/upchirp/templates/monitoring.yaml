# System health only: Prometheus scrapes the services, Grafana shows one dashboard.
# Radar data is never shown here; that is the live view's job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  labels: {{- include "upchirp.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: upchirp-api
        metrics_path: /metrics/
        static_configs: [{targets: ["upchirp-api:8000"]}]
      - job_name: upchirp-stream
        dns_sd_configs:
          - names: ["upchirp-metrics.{{ .Release.Namespace }}.svc.cluster.local"]
            type: A
            port: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{- include "upchirp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.images.prometheus }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          resources: {{- toYaml .Values.resources.prometheus | nindent 12 }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes:
        - name: config
          configMap: {name: prometheus}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels: {{- include "upchirp.labels" . | nindent 4 }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - {name: Prometheus, type: prometheus, uid: prometheus, url: "http://prometheus:9090", isDefault: true}
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - {name: upchirp, folder: Upchirp, type: file, options: {path: /var/lib/grafana/dashboards}}
  upchirp-health.json: |
{{ .Files.Get "dashboards/upchirp-health.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {{- include "upchirp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.images.grafana }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          resources: {{- toYaml .Values.resources.grafana | nindent 12 }}
          env:
            # view only: no login form, so the default admin password cannot be used
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/upchirp-health.json}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml}
            - {name: provisioning, mountPath: /var/lib/grafana/dashboards/upchirp-health.json, subPath: upchirp-health.json}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000, nodePort: {{ .Values.grafana.nodePort }}}]
