# Every image is loaded from the offline bundle; nothing is pulled from the internet.
images:
  app: docker.io/library/upchirp-app:0.1.0
  redpanda: docker.redpanda.com/redpandadata/redpanda:v24.2.7
  db: docker.io/library/upchirp-postgres:16          # deploy/images/postgres (1.7 GB)
  ollama: docker.io/library/upchirp-ollama-cpu:0.35.1  # deploy/images/ollama-cpu (0.2 GB)
  prometheus: docker.io/prom/prometheus:v3.5.0
  grafana: docker.io/grafana/grafana:12.1.1
pullPolicy: IfNotPresent

agent:
  model: qwen2.5:7b-instruct     # chat model, preloaded into hostPath below
  embedModel: nomic-embed-text   # for document search
  public: false                  # true = read-only tools (demo mode)

# Ollama model files are copied here by install.sh
ollamaHostPath: /var/lib/upchirp/ollama

source:
  # what the radar source replays until real hardware arrives (step 10)
  scenes: [default, crossing]

ui:
  nodePort: 30080     # also served on port 80 through k3s's Traefik ingress
grafana:
  nodePort: 30300

# Memory limits keep one service from starving the others on a small box. The 7B model
# needs about 5 GB, so ollama gets most of it.
resources:
  app: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 1Gi}}
  redpanda: {requests: {cpu: 100m, memory: 1Gi}, limits: {memory: 1536Mi}}
  db: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 2Gi}}
  ollama: {requests: {cpu: 500m, memory: 5Gi}, limits: {memory: 8Gi}}
  prometheus: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
  grafana: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}

storage:
  db: 10Gi
  redpanda: 5Gi
  data: 5Gi
