name: ci

on:
  push:
  pull_request:

# The jobs only read the code: no secrets, no deploys.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,agent,platform]"
      - run: ruff check .
      - run: mypy src
      - run: pytest tests
      # The chaos tests again, with many more random sequences than the 5 each above.
      - run: pytest tests -k chaos
        env:
          UPCHIRP_CHAOS_SEQUENCES: "100"
      # A regression fails the build. Agent evals skip here (no model in CI);
      # run them locally with Ollama up, or with UPCHIRP_MODEL=anthropic and a key.
      - run: pytest evals

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

  platform:
    # Redpanda and Postgres from compose.yaml; end-to-end stream test and SQL checks.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: docker volume create upchirp-ollama && docker compose up -d --wait redpanda db
      - run: pip install -e ".[dev,agent,platform]"
      - run: pytest tests/test_platform_live.py evals/test_agent_sql.py

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/upchirp
      - run: helm template up deploy/helm/upchirp --namespace upchirp > /dev/null
      - run: for f in deploy/bundle/*.sh deploy/demo/*.sh; do bash -n "$f"; done
