<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upchirp live view</title>
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/app-icon-32.png" />
    <link rel="apple-touch-icon" href="/brand/app-icon-180.png" />
    <meta name="theme-color" content="#193b22" />
    <meta name="description" content="Live tracks of people, cars and drone-like targets from a radar, and an AI agent that answers questions about what it saw." />
    <meta property="og:title" content="Upchirp live view" />
    <meta property="og:description" content="Live tracks of people, cars and drone-like targets from a radar, and an AI agent that answers questions about what it saw." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://ec2-51-21-241-160.eu-north-1.compute.amazonaws.com/" />
    <meta property="og:image" content="http://ec2-51-21-241-160.eu-north-1.compute.amazonaws.com/brand/live-view-thumbnail.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <header>
      <div class="brand"><img src="/brand/logo-on-dark.svg" alt="upchirp" /><span class="sub">live view</span></div>
      <div class="status">
        <span id="conn" class="pill off">offline</span>
        <span id="run" class="muted"></span>
        <span id="clock" class="mono"></span>
      </div>
    </header>
    <main>
      <section class="panel map">
        <h2>Top-down view <span class="muted">radar at the bottom, range rings every 10 m</span></h2>
        <canvas id="map" role="img" aria-label="Top-down map of the tracked targets"></canvas>
        <div class="legend">
          <span><i class="dot person"></i>person</span>
          <span><i class="dot car"></i>car</span>
          <span><i class="dot drone_like"></i>drone-like</span>
          <span><i class="dot unknown"></i>not yet labelled</span>
        </div>
      </section>
      <section class="panel rd">
        <h2>Range and speed <span class="muted">brighter is a stronger echo</span></h2>
        <canvas id="rd" role="img" aria-label="Range and speed picture of the radar echoes"></canvas>
        <div class="axis-note muted">range (m) across, radial speed (m/s) up = moving away</div>
      </section>
      <section class="panel tracks">
        <h2>Tracks <span id="track-count" class="muted"></span></h2>
        <table>
          <thead><tr><th>id</th><th>type</th><th>range</th><th>angle</th><th>speed</th></tr></thead>
          <tbody id="track-rows"></tbody>
        </table>
      </section>
      <section class="panel chat">
        <h2>Ask the agent <span class="muted">answers come from the recorded data</span></h2>
        <div id="chat-log" role="log" aria-live="polite"></div>
        <form id="chat-form">
          <input id="chat-input" autocomplete="off" aria-label="Question for the agent"
                 placeholder="How many drone-like tracks crossed in the last 10 minutes?" />
          <button type="submit">Ask</button>
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
